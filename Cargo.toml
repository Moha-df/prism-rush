[package]
name = "prism_rush"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["serialize", "system_clipboard", "system_font_discovery"] }
bevy_replicon = "0.45"
bevy_replicon_iroh = "0.20"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5"
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

# Compile our own code with light optimizations (fast iteration),
# but dependencies (Bevy...) fully optimized: otherwise the game is very slow in debug.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 4

[dev-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }

